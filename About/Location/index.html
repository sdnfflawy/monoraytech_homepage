<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<script src="/layout.js"></script>
<main>
<section class="page-head">
    <div class="wrap">
        <p class="eyebrow">ABOUT US</p>
        <h1>오시는길</h1>
        <p>프로젝트 및 제품 관련 문의를 기다립니다</p>
    </div>
</section>

<section>
    <div class="wrap grid two">
        <div>
            <h2 class="eyebrow-title">연락처</h2>
            <table class="info">
                <tr><th>전화</th><td>02-857-3332</td></tr>
                <tr><th>주소</th><td>서울특별시 구로구 디지털로27길 24, 7층 701-2호<br>(구로동, 벽산디지털밸리1차)</td></tr>
            </table>
        </div>
        <div>
            <h2 class="eyebrow-title">오시는 길</h2>

<div class="lightbox" id="lightbox"><img src="/image/map.png" alt="모노래이테크 위치 지도 확대"></div>
<script>
    const lb = document.getElementById('lightbox');
    document.getElementById('mapImg').addEventListener('click', () => lb.classList.add('open'));
    lb.addEventListener('click', () => lb.classList.remove('open'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</main>
