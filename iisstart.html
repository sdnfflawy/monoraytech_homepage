<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모노래이테크</title>
<style>
  :root {
    --color-bg:   #FFFFFF;
    --color-ink:  #1B1B1B;
    --color-sub:  #6B6B6B;
    --color-line: #E3E3E3;
    --color-accent: #2C5F8A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: var(--color-ink);
    background: var(--color-bg);
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ===== 헤더 / 메뉴 ===== */
  header {
    border-bottom: 1px solid var(--color-line);
    position: sticky;
    top: 0;
    background: var(--color-bg);
    z-index: 10;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
  }

  nav {
    display: flex;
    gap: 28px;
  }

  nav a {
    font-size: 0.95rem;
    color: var(--color-sub);
  }

  nav a:hover { color: var(--color-accent); }

  /* ===== 섹션 공통 (지금은 틀만) ===== */
  section {
    padding: 72px 0;
    border-bottom: 1px solid var(--color-line);
  }

  section:last-of-type { border-bottom: none; }

  section h2 {
    font-size: 1.4rem;
    margin: 0 0 8px;
  }

  .section-note {
    font-size: 0.9rem;
    color: var(--color-sub);
  }

  /* ===== 히어로 (최소한만) ===== */
  .hero {
    padding: 88px 0 56px;
  }

  .hero h1 {
    font-size: 2rem;
    margin: 0 0 12px;
  }

  .hero p {
    color: var(--color-sub);
    margin: 0;
  }

  /* ===== 푸터 ===== */
  footer {
    padding: 32px 0;
    border-top: 1px solid var(--color-line);
    font-size: 0.85rem;
    color: var(--color-sub);
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a href="#top" class="logo">모노래이테크</a>
    <nav>
      <a href="about.html">회사소개</a>
      <a href="#business">사업분야</a>
      <a href="#solution">솔루션</a>
      <a href="#projects">실적</a>
      <a href="#contact">문의</a>
    </nav>
  </div>
</header>



<footer>

  </div>
</footer>

</body>
</html>
